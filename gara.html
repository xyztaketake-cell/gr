<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxian Replica</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none; /* スマホでのスクロール・ズーム防止 */
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .message {
            color: #FF0000;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px #FFF;
            text-align: center;
            display: none;
        }
        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #FFF;
            font-size: 18px;
            pointer-events: none;
        }
        #high-score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #FFFF00;
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="score-board">SCORE<br><span id="scoreVal">0</span></div>
    <div id="high-score">HIGH<br><span id="highScoreVal">5000</span></div>
    <div id="ui-layer">
        <div id="start-msg" class="message" style="display:block; color:cyan;">TAP TO START</div>
        <div id="game-over-msg" class="message">GAME OVER</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- 設定と変数 ---
        let width, height;
        let scale = 1; 
        let animationId;
        let score = 0;
        let highScore = 5000;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let frameCount = 0;

        // 星空（スクロール用）
        const stars = [];

        // プレイヤー
        const player = {
            x: 0, y: 0, width: 20, height: 20,
            bullet: null, // ギャラクシアンは画面内に弾は1発のみ
            dead: false
        };

        // 敵
        let enemies = [];
        const enemyRows = 4;
        const enemyCols = 8; // 8列
        const enemyBaseSize = 16;
        let convoyX = 0; // 編隊の基準X位置
        let convoyDir = 1; // 編隊の移動方向
        let activeEnemies = 0; // 生存数

        // 音声（簡易的な周波数）
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'dive') {
                 // 降下音（長め）
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.5);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- 初期化 ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // 画面幅に応じたスケール計算
            scale = width < 600 ? 1 : 1.5;
            
            player.y = height - 50 * scale;
            if(gameState === 'START') player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // 星の初期化
        for(let i=0; i<60; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 2 + 0.5,
                color: Math.random() > 0.9 ? ['#F00', '#0F0', '#00F'][Math.floor(Math.random()*3)] : '#FFF'
            });
        }

        function initGame() {
            score = 0;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('start-msg').style.display = 'none';
            document.getElementById('game-over-msg').style.display = 'none';
            player.dead = false;
            player.x = width / 2;
            player.bullet = null;
            
            initEnemies();
            gameState = 'PLAYING';
            initAudio();
        }

        function initEnemies() {
            enemies = [];
            convoyX = width / 2;
            
            // 敵の生成
            // Row 0: Boss (Yellow), 1: Red, 2: Purple, 3: Blue
            for(let r=0; r<enemyRows; r++) {
                for(let c=0; c<enemyCols; c++) {
                    const type = r === 0 ? 'boss' : (r === 1 ? 'red' : (r === 2 ? 'purple' : 'blue'));
                    const scoreVal = r === 0 ? 60 : (r === 1 ? 50 : (r === 2 ? 40 : 30));
                    
                    enemies.push({
                        gx: c - (enemyCols-1)/2, // グリッド上の相対X座標 (-3.5 ~ 3.5)
                        gy: r,                   // グリッド上の相対Y座標
                        x: 0, y: 0,
                        width: enemyBaseSize * scale,
                        height: enemyBaseSize * scale,
                        type: type,
                        score: scoreVal,
                        state: 'formation', // formation, diving, returning
                        angle: 0,
                        vx: 0, vy: 0,
                        diveStep: 0
                    });
                }
            }
            activeEnemies = enemies.length;
        }

        // --- 描画ヘルパー ---
        function drawSprite(ctx, x, y, type, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);

            if (type === 'player') {
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(8, 8);
                ctx.lineTo(0, 4);
                ctx.lineTo(-8, 8);
                ctx.fill();
                ctx.fillStyle = '#F00';
                ctx.fillRect(-1, -12, 2, 4);
            } else if (type === 'boss') { // Galaxian Flagship
                ctx.fillStyle = '#FF0'; // Yellow
                ctx.beginPath();
                ctx.moveTo(0, 8); ctx.lineTo(8, -4); ctx.lineTo(0, -8); ctx.lineTo(-8, -4); 
                ctx.fill();
                ctx.fillStyle = '#F00'; // Red wings
                ctx.fillRect(-6, -2, 3, 6); ctx.fillRect(3, -2, 3, 6);
            } else if (type === 'red') {
                ctx.fillStyle = '#F00';
                ctx.beginPath();
                ctx.moveTo(0, 6); ctx.lineTo(6, -2); ctx.lineTo(3, -6); ctx.lineTo(-3, -6); ctx.lineTo(-6, -2);
                ctx.fill();
            } else if (type === 'purple') {
                ctx.fillStyle = '#F0F';
                ctx.beginPath();
                ctx.moveTo(0, 6); ctx.lineTo(6, -6); ctx.lineTo(0, -2); ctx.lineTo(-6, -6);
                ctx.fill();
            } else if (type === 'blue') {
                ctx.fillStyle = '#0FF';
                ctx.beginPath();
                ctx.moveTo(0, 6); ctx.lineTo(6, -2); ctx.lineTo(0, -6); ctx.lineTo(-6, -2);
                ctx.fill();
            }
            ctx.restore();
        }

        // --- 更新ロジック ---
        function update() {
            if (gameState !== 'PLAYING') return;
            frameCount++;

            // 編隊の全体移動（左右に揺れる）
            const convoyOffset = Math.sin(frameCount * 0.02) * (width * 0.25);
            const currentConvoyX = (width / 2) + convoyOffset;

            // 敵の更新
            let formationCount = 0;
            
            enemies.forEach(e => {
                if (!e.state) return; // 死んだ敵

                if (e.state === 'formation') {
                    // 編隊位置の計算
                    const spacing = 25 * scale;
                    e.x = currentConvoyX + (e.gx * spacing);
                    e.y = 50 * scale + (e.gy * spacing);
                    e.angle = 0;
                    formationCount++;

                    // 攻撃開始判定 (ランダム & 画面外でない)
                    if (Math.random() < 0.005 && activeEnemies > 0) {
                        e.state = 'diving';
                        playSound('dive');
                        // プレイヤーに向かうベクトル計算
                        const dx = player.x - e.x;
                        const dy = player.y - e.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        e.vx = (dx / dist) * 4 * scale;
                        e.vy = (dy / dist) * 4 * scale + 2 * scale; // 下方向成分強め
                    }
                } else if (e.state === 'diving') {
                    // 降下攻撃
                    e.x += e.vx;
                    e.y += e.vy;
                    // 進行方向を向く
                    e.angle = Math.atan2(e.vy, e.vx) - Math.PI/2;

                    // 画面外に出たら上に戻る
                    if (e.y > height + 20) {
                        e.state = 'formation';
                        e.y = -20;
                    }
                    
                    // プレイヤーとの当たり判定
                    if (Math.abs(e.x - player.x) < 15 * scale && Math.abs(e.y - player.y) < 15 * scale) {
                        gameState = 'GAMEOVER';
                        document.getElementById('game-over-msg').style.display = 'block';
                        if (score > highScore) {
                            highScore = score;
                            document.getElementById('highScoreVal').innerText = highScore;
                        }
                    }
                }
            });

            // 全滅したら復活
            if (activeEnemies === 0) {
                initEnemies();
            }

            // 弾の移動
            if (player.bullet) {
                player.bullet.y -= 10 * scale;
                // 画面外
                if (player.bullet.y < 0) {
                    player.bullet = null;
                } else {
                    // 敵との当たり判定
                    for (let i = 0; i < enemies.length; i++) {
                        const e = enemies[i];
                        if (e.state && 
                            Math.abs(e.x - player.bullet.x) < e.width && 
                            Math.abs(e.y - player.bullet.y) < e.height) {
                            
                            // Hit!
                            playSound('hit');
                            score += e.state === 'diving' ? e.score * 2 : e.score; // 降下中は得点2倍
                            document.getElementById('scoreVal').innerText = score;
                            
                            delete enemies[i].state; // 敵を消去フラグ
                            activeEnemies--;
                            player.bullet = null;
                            break;
                        }
                    }
                }
            }
        }

        // --- 描画ループ ---
        function loop() {
            // 背景クリア
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // 星
            stars.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, 2, 2);
                s.y += s.speed * (gameState === 'GAMEOVER' ? 0.2 : 1);
                if (s.y > height) { s.y = 0; s.x = Math.random() * width; }
            });

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                // 敵描画
                enemies.forEach(e => {
                    if (e.state) {
                        drawSprite(ctx, e.x, e.y, e.type, e.angle);
                    }
                });

                // プレイヤー描画
                if (!player.dead) {
                    drawSprite(ctx, player.x, player.y, 'player', 0);
                }

                // 弾描画
                if (player.bullet) {
                    ctx.fillStyle = '#FF0';
                    ctx.fillRect(player.bullet.x - 2, player.bullet.y - 5, 4, 10);
                }
            }

            update();
            animationId = requestAnimationFrame(loop);
        }

        // --- 入力処理 (スマホ & PC) ---
        let isTouch = false;

        function handleStart(e) {
            if (e.type === 'touchstart') isTouch = true;
            
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                initGame();
                return;
            }
            
            // タップ/クリックで発射（弾がない場合のみ）
            if (gameState === 'PLAYING' && !player.bullet) {
                player.bullet = { x: player.x, y: player.y - 10 };
                playSound('shoot');
            }
        }

        function handleMove(e) {
            e.preventDefault();
            if (gameState !== 'PLAYING') return;

            let clientX;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            player.x = clientX;
            // 画面外制限
            if (player.x < 20) player.x = 20;
            if (player.x > width - 20) player.x = width - 20;
        }

        // イベントリスナー
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});

        // ループ開始
        loop();

    </script>
</body>
</html>
