<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxian Real Ver.</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', monospace;
            color: white;
        }
        canvas {
            display: block;
            margin: 0 auto;
            /* ドット絵をくっきり見せるための設定 */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .message {
            font-size: 24px; font-weight: bold; text-align: center; text-shadow: 2px 2px #000;
        }
        #start-msg { color: cyan; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #score-board {
            position: absolute; top: 10px; left: 10px; font-size: 18px; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="score-board">SCORE: <span id="scoreVal">0</span></div>
    <div id="ui-layer">
        <div id="start-msg" class="message">TAP TO START</div>
        <div id="game-over-msg" class="message" style="display:none; color: red;">GAME OVER<br><span style="font-size:16px; color:white;">TAP TO RETRY</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 描画用ヘルパー関数（ドット絵風の図形を描く） ---
        function drawPixelShape(ctx, x, y, scale, color, shapeData) {
            ctx.fillStyle = color;
            ctx.beginPath();
            // shapeDataは [x1,y1, x2,y2, ...] の形式
            if (shapeData.length > 0) {
                ctx.moveTo(x + shapeData[0] * scale, y + shapeData[1] * scale);
                for (let i = 2; i < shapeData.length; i += 2) {
                    ctx.lineTo(x + shapeData[i] * scale, y + shapeData[i + 1] * scale);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        // 自機 (Galaxip)
        function drawPlayerSprite(ctx, x, y, scale) {
            const s = scale * 0.8; // 少し小さめに調整
            // 白いボディ
            drawPixelShape(ctx, x, y, s, '#FFF', [
                0,-10, 3,-7, 3,2, 8,6, 8,8, -8,8, -8,6, -3,2, -3,-7
            ]);
            // 赤い先端
            drawPixelShape(ctx, x, y, s, '#F00', [
                0,-12, 2,-10, 0,-8, -2,-10
            ]);
        }

        // 敵 (Aliens)
        function drawEnemySprite(ctx, x, y, type, scale, angle) {
            ctx.save();
            ctx.translate(x, y);
            if (angle !== 0) ctx.rotate(angle);
            const s = scale * 0.9;

            switch(type) {
                case 0: // BOSS (Flagship - Yellow/Red)
                    // 赤い翼
                    drawPixelShape(ctx, 0, 0, s, '#F00', [-8,-4, -3,-4, -3,2, -8,6, 8,6, 3,2, 3,-4, 8,-4, 5,-8, -5,-8]);
                    // 黄色い本体
                    drawPixelShape(ctx, 0, 0, s, '#FF0', [-3,-6, 3,-6, 5,-2, 2,4, -2,4, -5,-2]);
                    break;
                case 1: // RED (Kamikaze)
                    drawPixelShape(ctx, 0, 0, s, '#F00', [0,-7, 5,-3, 7,1, 3,5, 3,7, -3,7, -3,5, -7,1, -5,-3]);
                    // 目
                    ctx.fillStyle = '#000'; ctx.fillRect(-3*s, 0, 2*s, 2*s); ctx.fillRect(1*s, 0, 2*s, 2*s);
                    break;
                case 2: // PURPLE (Goei)
                    drawPixelShape(ctx, 0, 0, s, '#F0F', [-6,-6, 6,-6, 8,-2, 4,4, 4,7, -4,7, -4,4, -8,-2]);
                    // 目
                    ctx.fillStyle = '#000'; ctx.fillRect(-4*s, -2*s, 2*s, 2*s); ctx.fillRect(2*s, -2*s, 2*s, 2*s);
                    break;
                case 3: // GREEN (Zako - 本物と同じ緑色を追加)
                    drawPixelShape(ctx, 0, 0, s, '#0F0', [0,-6, 4,-4, 6,0, 6,4, 2,7, -2,7, -6,4, -6,0, -4,-4]);
                     // 目
                    ctx.fillStyle = '#000'; ctx.fillRect(-3*s, 0, 2*s, 2*s); ctx.fillRect(1*s, 0, 2*s, 2*s);
                    break;
            }
            ctx.restore();
        }

        // --- ゲーム本体 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, scale;
        let gameState = 'START'; 
        let score = 0;
        let frameCount = 0;
        let animationId;

        const player = { x: 0, y: 0, w: 24, h: 24, bullet: null };
        let enemies = [];
        const rows = 4, cols = 6; 
        let activeEnemies = 0;

        // 音声 (前回の安全版を使用)
        let audioCtx = null;
        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'shoot') {
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            } catch(e) {}
        }

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            scale = width < 600 ? 1.5 : 2; // スケールを少し大きめに
            player.y = height - 60 * scale;
            if (gameState === 'START') player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            score = 0;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('start-msg').style.display = 'none';
            document.getElementById('game-over-msg').style.display = 'none';
            player.x = width / 2; player.bullet = null;
            
            enemies = [];
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    enemies.push({
                        gx: c - (cols-1)/2, gy: r,
                        x: 0, y: 0,
                        w: 20 * scale, h: 16 * scale, // 当たり判定サイズ調整
                        type: r, // 0:Boss, 1:Red, 2:Purple, 3:Green
                        state: 'formation',
                        angle: 0, vx: 0, vy: 0
                    });
                }
            }
            activeEnemies = enemies.length;
            gameState = 'PLAYING';
            if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function update() {
            if (gameState !== 'PLAYING') return;
            frameCount++;
            const cx = (width/2) + Math.sin(frameCount * 0.02) * (width * 0.25);

            enemies.forEach(e => {
                if (e.state === 'dead') return;
                if (e.state === 'formation') {
                    e.x = cx + e.gx * (30 * scale); // 間隔調整
                    e.y = (60 * scale) + e.gy * (25 * scale);
                    e.angle = 0;
                    if (Math.random() < 0.008 && activeEnemies > 0) {
                        e.state = 'diving';
                        const dx = player.x - e.x; const dy = player.y - e.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        e.vx = (dx/dist)*(3.5*scale); e.vy = (dy/dist)*(3.5*scale) + (1.5*scale);
                    }
                } else if (e.state === 'diving') {
                    e.x += e.vx; e.y += e.vy;
                    e.angle = Math.atan2(e.vy, e.vx) - Math.PI/2; // 進行方向を向く
                    if (e.y > height + 30) e.state = 'formation';
                    // 当たり判定を少し厳しめに
                    if (Math.abs(e.x - player.x) < 10*scale && Math.abs(e.y - player.y) < 10*scale) {
                        gameState = 'GAMEOVER';
                        document.getElementById('game-over-msg').style.display = 'block';
                    }
                }
            });

            if (activeEnemies === 0) setTimeout(initGame, 1000);

            if (player.bullet) {
                player.bullet.y -= 10 * scale;
                if (player.bullet.y < 0) player.bullet = null;
                else {
                    for(let i=0; i<enemies.length; i++) {
                        const e = enemies[i];
                        if (e.state !== 'dead' && 
                            Math.abs(e.x - player.bullet.x) < e.w/2 && 
                            Math.abs(e.y - player.bullet.y) < e.h/2) {
                            e.state = 'dead';
                            score += (e.state === 'diving' ? 100 : (40 - e.type*10));
                            document.getElementById('scoreVal').innerText = score;
                            player.bullet = null; activeEnemies--; playSound('hit');
                            break;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#888'; // 星の色を少し暗く
            for(let i=0; i<40; i++) {
                ctx.fillRect((frameCount * (i%2+1)*0.5 + i*70) % width, (i*50 + frameCount) % height, scale, scale);
            }

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                // プレイヤー描画 (新しい関数を使用)
                drawPlayerSprite(ctx, player.x, player.y, scale);

                // 敵描画 (新しい関数を使用)
                enemies.forEach(e => {
                    if (e.state !== 'dead') {
                        drawEnemySprite(ctx, e.x, e.y, e.type, scale, e.angle);
                    }
                });

                // 弾
                if (player.bullet) {
                    ctx.fillStyle = '#FF0';
                    ctx.fillRect(player.bullet.x - scale, player.bullet.y, 2*scale, 8*scale);
                }
            }
            requestAnimationFrame(loop);
        }

        function loop() { update(); draw(); }
        loop();

        function handleStart(e) {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                initGame(); if(e.type === 'touchstart') e.preventDefault();
            } else if (gameState === 'PLAYING' && !player.bullet) {
                player.bullet = { x: player.x, y: player.y - 20*scale };
                playSound('shoot');
            }
        }
        function handleMove(e) {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            const cx = (e.touches ? e.touches[0].clientX : e.clientX);
            player.x = cx;
        }
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, {passive: false});
    </script>
</body>
</html>
